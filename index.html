
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcowsky</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            margin: 0;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 350px;
        }

        .box {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            padding: 40px 30px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #a8a8a8;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #0095f6;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background-color: #1877f2;
        }

        button:disabled {
            background-color: #b2dffc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .footer {
            background: #ffffff;
            border: 1px solid #dbdbdb;
            border-top: none;
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #8e8e8e;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">
        <div class="title">Marcowsky</div>

        <input
            type="text"
            id="userInput"
            placeholder="Scrivi il messaggio"
            autocomplete="off"
        >

        <button id="sendBtn" onclick="sendToDiscord()">
            Invia
        </button>

        <div id="status"></div>
    </div>

    <div class="footer">
        Progetto personale
    </div>

</div>

<script>
async function sendToDiscord() {
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const status = document.getElementById('status');
    const text = input.value.trim();

    const WEBHOOK_URL = "https://discordapp.com/api/webhooks/1463572078853751026/-WngAbTNw8s50SDnZrcuPn5fqmnyCs2IjhQYPG59A5pyyg5ByefkSRt7kMVy2FmRgLq1";

    if (!text) {
        status.style.color = "#ed4956";
        status.innerText = "Inserisci un messaggio";
        return;
    }

    btn.disabled = true;
    status.style.color = "#262626";
    status.innerText = "Invio in corso...";

    try {
        const response = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ content: text })
        });

        if (response.ok) {
            status.style.color = "#2ecc71";
            status.innerText = "Messaggio inviato";
            input.value = "";
        } else {
            status.style.color = "#ed4956";
            status.innerText = "Errore Discord (" + response.status + ")";
        }
    } catch (err) {
        status.style.color = "#ed4956";
        status.innerText = "Errore di connessione";
        console.error(err);
    } finally {
        btn.disabled = false;
    }
}

document.getElementById('userInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
        sendToDiscord();
    }
});
</script>

</body>
</html>
